<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Git Navigator Desktop App</title>
    <meta
      name="description"
      content="Git Navigator Desktop is a native desktop app for visual Git operations on macOS and Windows."
    />
    <link rel="icon" href="static/icon.png" type="image/png" />
    <link rel="stylesheet" href="static/site.css" />
  </head>
  <body class="page-tauri-alpha">
    <header>
      <div class="container hero">
        <div class="hero-copy">
          <p class="eyebrow">Desktop app</p>
          <h1>Git Navigator</h1>
          <p class="lead">A native desktop build of Git Navigator.</p>
          <p>
            Initial desktop release. Download for macOS (Apple Silicon) or Windows (x64).
          </p>
          <div class="hero-actions">
            <a class="button" href="https://github.com/binhonglee/git_navigator/releases/latest/download/Git.Navigator_0.3.3_aarch64.dmg">Download for macOS</a>
            <a class="button secondary" href="https://github.com/binhonglee/git_navigator/releases/latest/download/Git.Navigator_0.3.3_x64.msi">Download for Windows</a>
          </div>
        </div>
        <figure class="hero-shot">
          <picture
            data-hero-shot
            data-light-macos="static/tauri_light_macos.png"
            data-dark-macos="static/tauri_dark_macos.png"
            data-light-windows="static/tauri_light_windows.png"
            data-dark-windows="static/tauri_dark_windows.png"
          >
            <source srcset="static/tauri_dark_macos.png" media="(prefers-color-scheme: dark)" />
            <img src="static/tauri_light_macos.png" alt="Git Navigator desktop application screenshot" />
          </picture>
        </figure>
      </div>
    </header>

    <script src="static/site.js"></script>
  </body>
</html>
